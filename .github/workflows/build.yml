name: Build ThreadVolume

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip
          coverage: none
      - name: Lint and test
        run: |
          git ls-files -z '*.php' | xargs -0 -n1 php -l
          php tests/volume-rules.php
      - name: Build XenForo ZIP
        run: |
          php build.php --dry-run
          php build.php
          unzip -t _releases/XS-ThreadVolume-*.zip
      - uses: actions/upload-artifact@v6
        with:
          name: XS-ThreadVolume
          path: _releases/XS-ThreadVolume-*.zip
          if-no-files-found: error
